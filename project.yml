name: EPaperNFC
options:
  bundleIdPrefix: lk.betech
  deploymentTarget:
    iOS: "16.0"
targets:
  EPaperNFC:
    type: application
    platform: iOS
    sources: [EPaperNFC]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lk.betech.epapernfc
        INFOPLIST_FILE: EPaperNFC/Info.plist
        CODE_SIGN_ENTITLEMENTS: EPaperNFC/EPaperNFC.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Raise CURRENT_PROJECT_VERSION for every TestFlight upload (App Store Connect rejects repeats).
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
